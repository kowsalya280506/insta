<!DOCTYPE html>
<html>
<head>
<title>InstaMini</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fafafa}
header{background:white;border-bottom:1px solid #ddd;padding:15px;
display:flex;justify-content:space-between;align-items:center}
h2{margin:0;color:#222}.box{max-width:500px;margin:25px auto;padding:20px}
input,textarea,button{padding:12px;margin:6px 0;border:1px solid #ccc;
border-radius:8px;font-size:15px}input,textarea{width:100%}
button{background:#2196f3;color:white;border:0;cursor:pointer}
.card{background:white;border:1px solid #ddd;border-radius:10px;margin:15px 0;
padding:15px}.post{width:100%;max-height:400px;object-fit:cover;border-radius:8px}
.actions button{background:none;color:#222;padding:6px}.red{color:red!important}
.profile{text-align:center;background:white;padding:20px;border-bottom:1px solid #ddd}
.hidden{display:none}.user{font-weight:bold}
#login{margin-top:80px;background:white;border-radius:15px;box-shadow:0 2px 15px #ccc}
small{color:#777}.comment{padding:5px;border-top:1px solid #eee}
</style>
</head>

<body>
<div id="login" class="box">
<h1 style="text-align:center">📸 InstaMini</h1>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error"></p>
</div>

<div id="app" class="hidden">
<header>
<h2>📸 InstaMini</h2>
<input id="search" style="width:180px" placeholder="Search user"
onkeyup="searchUser()">
<button onclick="logout()">Logout</button>
</header>

<div id="profile"></div>

<div class="box">
<h3>Create Post</h3>
<textarea id="postText" placeholder="Write something..."></textarea>
<input id="postImg" placeholder="Image URL (optional)">
<button onclick="createPost()">Post</button>
</div>

<div id="feed" class="box"></div>
</div>

<script>
let users=JSON.parse(localStorage.users||"{}");
let posts=JSON.parse(localStorage.posts||"[]");
let me=localStorage.me||"";

function save(){
localStorage.users=JSON.stringify(users);
localStorage.posts=JSON.stringify(posts);
}

function login(){
let u=user.value.trim(),p=pass.value;
if(!u||!p)return error.innerText="Enter username and password";
if(!users[u])users[u]={password:p,followers:[],following:[]};
else if(users[u].password!=p)return error.innerText="Wrong password";
me=u;localStorage.me=me;save();showApp();
}

function showApp(){
loginBox(false);profile.innerHTML=profileHTML(me);feed.innerHTML="";
posts.slice().reverse().forEach((x,i)=>feed.innerHTML+=postHTML(x));
}

function loginBox(x){
document.getElementById("login").classList.toggle("hidden",!x);
document.getElementById("app").classList.toggle("hidden",x);
}

function logout(){localStorage.removeItem("me");location.reload()}

function profileHTML(u){
let f=users[u].followers.length,fg=users[u].following.length;
let follow=u!=me&&users[u].followers.includes(me);
return `<div class="profile"><h2>@${u}</h2>
<p>Followers: ${f} &nbsp; Following: ${fg}</p>
${u!=me?`<button onclick="follow('${u}')">${follow?'Unfollow':'Follow'}</button>`:
'<button onclick="showFollowing()">My Following</button>'}</div>`;
}

function createPost(){
let text=postText.value.trim(),img=postImg.value.trim();
if(!text&&!img)return;
posts.push({id:Date.now(),user:me,text,img,likes:[],comments:[]});
postText.value=postImg.value="";save();showApp();
}

function postHTML(x){
let liked=x.likes.includes(me);
let comments=x.comments.map(c=>`<div class="comment">
<b>${c.user}</b>: ${c.text}</div>`).join("");
return `<div class="card">
<span class="user">@${x.user}</span><br><small>Post</small>
${x.img?`<img class="post" src="${x.img}">`:""}
<p>${x.text}</p>
<div class="actions">
<button class="${liked?'red':''}" onclick="like(${x.id})">
${liked?'❤️':'♡'} ${x.likes.length}</button>
<button onclick="comment(${x.id})">💬 ${x.comments.length}</button>
<button onclick="viewUser('${x.user}')">👤 Profile</button>
</div>${comments}</div>`;
}

function like(id){
let x=posts.find(p=>p.id==id);
x.likes=x.likes.includes(me)?x.likes.filter(u=>u!=me):[...x.likes,me];
save();showApp();
}

function comment(id){
let text=prompt("Enter comment:");
if(!text)return;
posts.find(p=>p.id==id).comments.push({user:me,text});
save();showApp();
}

function follow(u){
let a=users[u].followers,b=users[me].following;
if(a.includes(me)){users[u].followers=a.filter(x=>x!=me);
users[me].following=b.filter(x=>x!=u)}
else{a.push(me);b.push(u)}
save();viewUser(u);
}

function viewUser(u){
profile.innerHTML=profileHTML(u);
feed.innerHTML=posts.filter(x=>x.user==u).reverse()
.map(x=>postHTML(x)).join("");
}

function searchUser(){
let q=search.value.trim();
if(!q)return showApp();
let names=Object.keys(users).filter(x=>x.toLowerCase().includes(q.toLowerCase()));
feed.innerHTML=names.map(u=>`<div class="card">
<h3>@${u}</h3><button onclick="viewUser('${u}')">View Profile</button>
</div>`).join("");
}

function showFollowing(){
let list=users[me].following;
feed.innerHTML="<h3>People I Follow</h3>"+
(list.length?list.map(u=>`<div class="card">@${u}
<button onclick="viewUser('${u}')">View</button></div>`).join("")
:"<p>Not following anyone</p>");
}

if(me&&users[me]){loginBox(false);showApp()}else loginBox(true);
</script>
</body>
</html>
